<!doctype html>
<html lang="en">
    <head>
        <title>Hover</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./main.css" />
        <script type="module" src="/01-hover.ts"></script>
    </head>

    <body>
        <p><a href="/">Examples</a></p>
        <h1>Hover</h1>
        <p>The usual way: an icon plays its default state when the pointer enters it.</p>
        <div class="tiles">
            <figure>
                <div class="icon" data-icon="coins"></div>
                <figcaption>coins</figcaption>
            </figure>
            <figure>
                <div class="icon" data-icon="lock"></div>
                <figcaption>lock</figcaption>
            </figure>
            <figure>
                <div class="icon" data-icon="morph-select"></div>
                <figcaption>morph-select</figcaption>
            </figure>
        </div>
    </body>
</html>
